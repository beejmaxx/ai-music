name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Validation tooling
        run: |
          python3 tests/stream_check.py
          python3 tests/live_tuning.py
          python3 tests/gpu_check.py
          python3 tests/functional_host_tests.py
      - name: Local controls and browser station
        run: |
          python3 tests/live_controls.py build/ai-music --allow-scheduler-delays
          python3 tests/web_station.py --allow-scheduler-delays
